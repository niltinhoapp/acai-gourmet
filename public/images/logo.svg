<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Símbolo: Tigela Gourmet com Folha Tropical e Bagas de Açaí -->
  <g transform="translate(10, 10)">
    <!-- Base da Tigela -->
    <path d="M 12 45 Q 40 85 68 45 Z" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="2"/>
    <!-- Topo / Conteúdo Cremoso da Tigela -->
    <ellipse cx="40" cy="45" rx="28" ry="10" fill="#2e1065"/>
    <ellipse cx="40" cy="44" rx="24" ry="7" fill="url(#purpleGrad)"/>
    
    <!-- Bagas de Açaí -->
    <circle cx="32" cy="40" r="7" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="48" cy="41" r="6" fill="#4a044e" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="41" cy="34" r="5.5" fill="url(#berryGrad)"/>

    <!-- Folha Tropical da Palmeira -->
    <path d="M 40 28 C 45 15, 62 10, 70 8 C 65 18, 55 24, 42 27 Z" fill="#10b981"/>
    <path d="M 40 28 C 48 20, 60 18, 68 18" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Brilho Dourado de Qualidade -->
    <path d="M 20 25 L 22 18 L 29 20 L 22 22 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="62" cy="48" r="2.5" fill="#fde047"/>
  </g>

  <!-- Tipografia da Marca -->
  <text x="100" y="52" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-0.5">
    AÇAÍ <tspan fill="url(#goldGrad)">TROPICAL</tspan>
  </text>
  <text x="102" y="76" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12" fill="#c084fc" letter-spacing="3.5">
    GOURMET &bull; 100% PURO DO PARÁ
  </text>
</svg>
